<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Luxury Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">LUXURY TIME</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="collection.html">Collection</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="login.html" id="auth-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;">
        <div>
            <h2 style="font-family: var(--font-serif); color: var(--primary-color); font-size: 3rem; margin-bottom: 1.5rem;">Get in Touch</h2>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem;">Have questions about a specific timepiece? Our specialists are available for private consultations.</p>
            <div style="margin-bottom: 1.5rem; font-size: 1.1rem;">
                <strong style="color: var(--primary-color);">Email:</strong> concierge@luxurytime.com
            </div>
            <div style="font-size: 1.1rem;">
                <strong style="color: var(--primary-color);">Phone:</strong> +1 (800) 123-4567
            </div>
        </div>
        <div style="background: var(--bg-card); padding: 3rem; border-top: 3px solid var(--primary-color);">
            <form onsubmit="event.preventDefault(); alert('We have received your request. A specialist will contact you soon.');">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Luxury Time. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
