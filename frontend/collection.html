                <h3 class="product-title">Royal Oak Automatic</h3>

            <div class="product-card">

            </div>
            <div class="product-card">
                <img src="https://images.pexels.com/photos/364822/rolex-watch-time-luxury-364822.jpeg?_gl=1*b4effm*_ga*MTU0OTA3NDIxNC4xNzY1Mjk5Nzcw*_ga_8JE65Q40S6*czE3NzMzMDAwMTkkbzIkZzEkdDE3NzMzMDAxNDckajU1JGwwJGgw" alt="Watch 3" class="product-img">

            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1594534475808-b18fc33b045e?w=400&q=80" alt="Watch 4" class="product-img">
