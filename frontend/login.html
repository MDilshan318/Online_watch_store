<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Luxury Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">LUXURY TIME</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="collection.html">Collection</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="login.html" id="auth-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" style="max-width: 500px;">
        <div style="background: var(--bg-card); padding: 3rem; border-top: 3px solid var(--primary-color);">
            <h2 style="font-family: var(--font-serif); color: var(--primary-color); margin-bottom: 2rem; text-align: center;">Welcome Back</h2>
            <div id="login-alert" class="alert"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Sign In</button>
                <div style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
                    Don't have an account? <a href="signup.html" style="color: var(--primary-color);">Register here</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Luxury Time. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
