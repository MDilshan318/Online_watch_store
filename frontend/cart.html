<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Luxury Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #b1915e; --bg-dark: #0a0a0a; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Inter', sans-serif; margin: 0; }
        nav { padding: 20px 50px; border-bottom: 1px solid #222; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--primary-color); text-decoration: none; font-weight: bold; }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #222; background: #111; margin-bottom: 10px; }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; }
        .item-info { flex-grow: 1; margin-left: 20px; }
        .item-info h4 { margin: 0; font-family: 'Playfair Display', serif; }
        .item-info p { margin: 5px 0; color: var(--primary-color); }
        .total-section { text-align: right; margin-top: 30px; font-size: 2rem; color: var(--primary-color); font-family: 'Playfair Display', serif; }
        .btn-remove { background: transparent; color: #ff4444; border: 1px solid #ff4444; padding: 5px 15px; cursor: pointer; }
        .btn-checkout { background: white; color: black; border: none; padding: 15px 40px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="collection.html" class="logo">LUXURY TIME</a>
        </nav>
    </header>

    <div class="container">
        <h2 style="font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 30px;">Your Items</h2>
        
        <div id="cart-list">
            </div>

        <div class="total-section" id="cart-total">Total: $0.00</div>
        
        <button class="btn-checkout" onclick="checkout()">PROCEED TO CHECKOUT</button>
    </div>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('luxury_cart')) || [];
            const container = document.getElementById('cart-list');
            const totalEl = document.getElementById('cart-total');

            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#888;">Your bag is empty.</p>';
                totalEl.textContent = "Total: $0.00";
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}">
                        <div class="item-info">
                            <h4>${item.name}</h4>
                            <p>$${item.price.toLocaleString()}</p>
                        </div>
                        <button class="btn-remove" onclick="remove(${index})">Remove</button>
                    </div>`;
            });

            totalEl.textContent = "Total: $" + total.toLocaleString(undefined, {minimumFractionDigits: 2});
        }

        function remove(index) {
            let cart = JSON.parse(localStorage.getItem('luxury_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('luxury_cart', JSON.stringify(cart));
            renderCart();
        }

        function checkout() {
            if(confirm("Complete purchase?")) {
                localStorage.removeItem('luxury_cart');
                alert("Thank you!");
                window.location.href = 'collection.html';
            }
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
